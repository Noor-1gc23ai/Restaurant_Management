<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Nova Table</title>
    <script>
      (() => {
        try {
          const storageKey = "The Nova Table-theme";
          const storedTheme = localStorage.getItem(storageKey);
          const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
          const theme = storedTheme === "day" || storedTheme === "night" ? storedTheme : systemTheme;
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle("light", theme === "day");
          document.documentElement.classList.toggle("dark", theme === "night");
          document.documentElement.style.colorScheme = theme === "day" ? "light" : "dark";
        } catch (error) {
          document.documentElement.dataset.theme = "night";
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
